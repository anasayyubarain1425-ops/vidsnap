# Render.com deployment config
# Free tier works for testing. Custom domains need a paid plan on Render.
# The nixpacks.toml in this repo installs yt-dlp + ffmpeg automatically.
services:
  - type: web
    name: videograbtool
    runtime: nixpacks
    plan: free
    buildCommand: touch .env && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
